# Builds and tests every pull request (Dependabot's included) and every push to main, the way
# the release workflow's test step does: cargo test --locked in app/, on Windows and Linux x64.
# It makes no installers or packages; release.yml does that from a tag.
# Actions are pinned to commit SHAs (the tag each one was at is noted alongside), as in release.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf \
            libssl-dev libxdo-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app
      - name: Test
        working-directory: app
        run: cargo test --locked
